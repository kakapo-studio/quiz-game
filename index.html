<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本の地理クイズ</title>
  <meta name="description" content="ブラウザで遊べる4択の日本地理クイズ。全10問、毎回ちがう順番で出題されます。">

  <!-- ファビコン（タブのアイコン）とホーム画面用アイコン -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- OGP（SNSでURLを共有したときの表示） -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="日本の地理クイズ">
  <meta property="og:description" content="ブラウザで遊べる4択の日本地理クイズ。全10問、毎回ちがう順番で出題されます。">
  <meta property="og:url" content="https://kakapo-studio.github.io/quiz-game/">
  <meta property="og:image" content="https://kakapo-studio.github.io/quiz-game/images/ogp.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>クイズゲーム</h1>

    <!-- タイトル画面 -->
    <section id="title-screen">
      <p class="lead">日本の地理クイズ！<br>全<span id="total"></span>問に挑戦しよう</p>
      <button id="start">スタート</button>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-screen" hidden>

      <!-- 問題を解くエリア -->
      <div id="quiz-area">
        <div class="progress">
          <p id="progress-text"></p>
          <div class="progress-bar">
            <div id="progress-fill"></div>
          </div>
        </div>

        <p id="question"></p>

        <div id="choices">
          <button></button>
          <button></button>
          <button></button>
          <button></button>
        </div>

        <p id="result"></p>

        <button id="next">次の問題へ</button>
      </div>

      <!-- 結果エリア -->
      <div id="summary" hidden>
        <p class="summary-label">あなたの結果</p>
        <p id="score-text"></p>
        <p id="rate-text"></p>
        <p id="comment"></p>
        <button id="retry">もう一度遊ぶ</button>
      </div>

    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
