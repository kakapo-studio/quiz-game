<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>クイズゲーム</h1>

    <!-- タイトル画面 -->
    <section id="title-screen">
      <p class="lead">日本の地理クイズ！<br>全<span id="total"></span>問に挑戦しよう</p>
      <button id="start">スタート</button>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-screen" hidden>

      <!-- 問題を解くエリア -->
      <div id="quiz-area">
        <div class="progress">
          <p id="progress-text"></p>
          <div class="progress-bar">
            <div id="progress-fill"></div>
          </div>
        </div>

        <p id="question"></p>

        <div id="choices">
          <button></button>
          <button></button>
          <button></button>
          <button></button>
        </div>

        <p id="result"></p>

        <button id="next">次の問題へ</button>
      </div>

      <!-- 結果エリア -->
      <div id="summary" hidden>
        <p class="summary-label">あなたの結果</p>
        <p id="score-text"></p>
        <p id="rate-text"></p>
        <p id="comment"></p>
        <button id="retry">もう一度遊ぶ</button>
      </div>

    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
