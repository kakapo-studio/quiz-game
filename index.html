<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>クイズゲーム</h1>

    <!-- タイトル画面 -->
    <section id="title-screen">
      <p class="lead">日本の地理クイズ！<br>全<span id="total"></span>問に挑戦しよう</p>
      <button id="start">スタート</button>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-screen" hidden>
      <p id="question"></p>

      <div id="choices">
        <button></button>
        <button></button>
        <button></button>
        <button></button>
      </div>

      <p id="result"></p>

      <button id="next">次の問題へ</button>
      <button id="retry" hidden>もう一度遊ぶ</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
